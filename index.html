<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--bg:#0a0c10;--card:#141821;--card2:#1c2230;--tx:#f4f6fa;--mut:#8b95a8;--bl:#1e6bff;--rd:#e5262f;--ye:#ffd21f;--gr:#22c55e;--or:#ff8a1f;--ln:#272e3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f6;--card:#fff;--card2:#f1f4f9;--tx:#0d1220;--mut:#5b6579;--ln:#dbe1ec}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

#app{max-width:980px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.os{cursor:pointer;display:grid;gap:4px}.os:active{transform:scale(.99)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi{border-left:4px solid var(--c);margin:0}.kpi strong{display:block;font-size:22px;margin-top:4px}
.b{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.btn.bl{background:var(--bl);border-color:var(--bl);color:#fff}.btn.gr{background:var(--gr);border-color:var(--gr);color:#04170b}.btn.rd{background:var(--rd);border-color:var(--rd);color:#fff}
.w{width:100%;margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:12px;font:inherit;margin:4px 0}
textarea{min-height:90px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border:2px dashed var(--ln);border-radius:12px;position:relative;overflow:hidden;color:var(--mut);font-size:12px;text-align:center}
.ph label{cursor:pointer;display:grid;place-content:center;gap:2px;width:100%;height:100%;font-size:26px}.ph label span{font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:var(--rd);color:#fff}
.ph i{position:absolute;bottom:0;left:0;right:0;background:#000a;color:#fff;font-style:normal;padding:2px}
.ck{font-size:13px;padding:10px}.ck[data-v="0"]{color:var(--gr)}.ck[data-v="1"]{color:var(--ye)}.ck[data-v="2"]{color:var(--rd)}
.tot{font-size:22px;font-weight:800;color:var(--ye)}
.login{max-width:420px;margin:0 auto;padding-top:24px}
.wm{text-align:center;margin-bottom:18px;background:#0a0c10;border-radius:16px;padding:22px;border-bottom:5px solid var(--bl)}
.wm b{display:block;font-size:64px;font-style:italic;font-weight:900;letter-spacing:-2px;background:linear-gradient(#fff,#8f99aa);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.wm span{display:block;color:#3d8bff;font-weight:800;font-size:18px}.wm small{letter-spacing:.35em;color:#dfe5f0}
.prof{display:grid;gap:8px;margin-top:8px}.ctr{display:block;text-align:center;margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font:600 11px system-ui;min-height:56px;cursor:pointer}
nav span{display:block;font-size:20px}nav .on{color:var(--ye)}
@media(min-width:900px){nav{top:0;right:auto;width:180px;flex-direction:column;justify-content:flex-start;padding-top:20px;border-top:0;border-right:1px solid var(--ln)}nav button{flex:none;text-align:left;padding:12px 18px;font-size:14px;min-height:0}nav span{display:inline;margin-right:8px}#app{margin-left:200px;max-width:none;padding:14px 24px 30px}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--bl);color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}#toast.on{opacity:1;transform:translate(-50%,0)}
.aviso{background:color-mix(in srgb,var(--ye) 12%,transparent);border:1px solid var(--ye);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--ye);border-color:var(--ye)}.dots.err{animation:sh .35s}.dots.err i{border-color:var(--rd)}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dots.err{animation:none}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.pad .btn{min-height:60px;font-size:24px}.btn.alt{opacity:.7}
#md{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:20px}#md.on{display:grid}#md>div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;max-width:360px;width:100%}
.qs{width:794px;padding:36px 40px;background:#fff;color:#1c2333;font:12px/1.45 Arial,Helvetica,sans-serif}.qs *{box-sizing:border-box}
.qh{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:2px solid #0d8bd9}.t1{font-size:22px;font-weight:800;color:#0f1b33}.t2{font-size:11px;font-weight:700;color:#0d8bd9;margin:2px 0 6px}.t3{color:#6b7385;font-size:10.5px}
.tr{text-align:right;font-size:10.5px;color:#3a4256;line-height:1.6}.bx{background:#0f1b33;color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:6px;margin-bottom:6px;display:inline-block}
.two{display:flex;gap:14px;margin:16px 0 12px}.cd{flex:1;background:#f5f7fa;border:1px solid #e1e5ee;border-radius:8px;padding:10px 14px}.cd h5,.tm h5{margin:0 0 6px;color:#0d8bd9;font-size:10.5px;border-bottom:1px solid #e1e5ee;padding-bottom:5px}.tm h5{color:#3a4256;border:0}.cd p{margin:3px 0}.cd i{font-style:normal;color:#6b7385;display:inline-block;width:88px}
.rel{background:#fff8e1;border:1px solid #f5d77a;border-left:4px solid #f5b400;border-radius:4px;padding:8px 12px;color:#7a4a00;margin-bottom:14px}
.qs h4{margin:14px 0 6px;font-size:12.5px;border-left:4px solid #0d8bd9;padding-left:8px;color:#0f1b33}.qs table{width:100%;border-collapse:collapse;font-size:11px}.qs th{background:#eef1f6;color:#3a4256;text-align:left;padding:8px;font-size:9.5px}.qs td{padding:8px;border-bottom:1px solid #e8ebf1}.qs .c{text-align:center}.qs .r{text-align:right}
.bt{display:flex;justify-content:space-between;gap:24px;margin-top:16px}.tm{flex:1;color:#5a6378;font-size:10.5px}.tm p{margin:3px 0}.ts{width:250px;border:1px solid #e1e5ee;font-size:11px}.ts div{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #e8ebf1;color:#3a4256}.ts .tv{background:#0f1b33;color:#fff;font-weight:800;font-size:13px;border:0}
.sg{display:flex;gap:40px;margin-top:46px;text-align:center}.sg div{flex:1;font-size:10.5px}.sg hr{border:0;border-top:1px solid #b9c0cf;margin:0 0 6px}.sg small{display:block;color:#8a93a6}
#pr{display:none}
@media print{body>*{display:none!important}body>#pr{display:block!important}.qs{width:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:0}}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div><div id="md"><div><p id="mt"></p><div class="btns"><button class="btn" onclick="ask.no()">Cancelar</button><button class="btn bl" onclick="ask.ok()">Confirmar</button></div></div></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=c=>'R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(6,'0'),br=d=>d.split('-').reverse().join('/');
const cents=v=>Math.round(parseFloat(String(v||'0').replace(',','.'))*100);
const ST=['AGUARDANDO DIAGNÓSTICO','DIAGNÓSTICO','AGUARDANDO ORÇAMENTO','AGUARDANDO APROVAÇÃO','AGUARDANDO PEÇA','EM ANDAMENTO','PAUSADO','FINALIZADO','PRONTO PARA ENTREGA','ENTREGUE','CANCELADO'];
const SC={'AGUARDANDO DIAGNÓSTICO':'--rd','DIAGNÓSTICO':'--rd','AGUARDANDO ORÇAMENTO':'--ye','AGUARDANDO APROVAÇÃO':'--bl','AGUARDANDO PEÇA':'--ye','EM ANDAMENTO':'--or','PAUSADO':'--mut','FINALIZADO':'--gr','PRONTO PARA ENTREGA':'--gr','ENTREGUE':'--gr','CANCELADO':'--mut'};
const BC={rascunho:'--mut',enviado:'--bl',aprovado:'--gr',recusado:'--rd'};
const RL={admin:'Administrador',recepcao:'Recepção',financeiro:'Financeiro',mecanico:'Mecânico',cliente:'Cliente'};
const PL=['Frente','Traseira','Lateral esq.','Lateral dir.','Painel / KM','Área do problema'];
const CK=['Riscos','Amassados','Para-brisa','Faróis','Pneus','Bancos','Painel','Motor','Freios','Suspensão'];
const ROLES={admin:['Administrador','🛠️',[['dash','Painel','📊'],['ent','Entrada','➕'],['list','OS','📋'],['fin','Financeiro','💰'],['usr','Usuários','👥']]],recepcao:['Recepção','🧾',[['ent','Entrada','➕'],['list','OS','📋']]],financeiro:['Financeiro','💵',[['fin','Financeiro','💰'],['list','OS','📋']]],mecanico:['Mecânico','🔧',[['list','Meus serviços','🔧'],['hist','Histórico','🗂️']]],cliente:['Cliente','🚗',[['list','Meus veículos','🚗']]]};
const mk=o=>({diag:'',it:[],desc:0,bs:'rascunho',pg:[],ph:[],sp:[],log:[],ck:[],hora:'08:30',...o});
const seed=()=>[
mk({id:128,cli:'João da Silva',tel:'62999990001',vei:'Honda Civic',ano:2018,placa:'ABC-1D23',km:84200,relato:'Veículo apresenta barulho na suspensão dianteira quando passa em quebra-molas.',mec:'Felipe',st:'EM ANDAMENTO',serv:'Suspensão dianteira',data:'2026-09-21',bs:'aprovado',it:[{t:'Serviço',d:'Substituição de amortecedor dianteiro',q:1,v:44000},{t:'Peça',d:'Amortecedor dianteiro',q:2,v:21000}],pg:[{f:'Pix',v:30000,d:'21/09/2026'}]}),
mk({id:129,cli:'Maria Oliveira',tel:'62999990002',vei:'Chevrolet Onix',ano:2021,placa:'QWE-4F56',km:41000,relato:'Luz da injeção acesa e o carro perde força ao acelerar.',mec:'Felipe',st:'AGUARDANDO DIAGNÓSTICO',serv:'Injeção eletrônica',data:'2026-09-23'}),
mk({id:127,cli:'Carlos Henrique',tel:'62999990003',vei:'Chevrolet Prisma',ano:2016,placa:'HJK-7L89',km:132500,relato:'Freio com barulho e pedal baixo.',mec:'Henrique',st:'AGUARDANDO APROVAÇÃO',serv:'Freios',data:'2026-09-22',bs:'enviado',it:[{t:'Serviço',d:'Troca de pastilhas e discos',q:1,v:28000},{t:'Peça',d:'Kit pastilhas e discos',q:1,v:32000}]}),
mk({id:126,cli:'Maria Oliveira',tel:'62999990004',vei:'Honda CG 160',tipo:'Moto',ano:2020,placa:'MNB-2C34',km:60100,relato:'Revisão e troca de óleo.',mec:'João',st:'FINALIZADO',serv:'Troca de óleo',data:'2026-09-19',bs:'aprovado',it:[{t:'Serviço',d:'Troca de óleo e filtros',q:1,v:18000},{t:'Peça',d:'Óleo 10W30 (1L)',q:1,v:22000}],pg:[{f:'Pix',v:40000,d:'20/09/2026'}]}),
mk({id:120,cli:'João da Silva',tel:'62999990001',vei:'Honda Civic',ano:2018,placa:'ABC-1D23',km:79800,relato:'Troca de óleo e revisão geral.',mec:'João',st:'ENTREGUE',serv:'Troca de óleo',data:'2026-06-10',bs:'aprovado',it:[{t:'Serviço',d:'Troca de óleo',q:1,v:15000},{t:'Peça',d:'Óleo 5W30 e filtro',q:1,v:20000}],pg:[{f:'Dinheiro',v:35000,d:'10/06/2026'}]})];
const K='wkk-oficina-v2';let me=null,pin='',bad=0,lockUntil=0,shake=false,editU=null,db=null,role=null,view='',sel=null,draft={ph:[]};
try{db=JSON.parse(localStorage.getItem(K))}catch(_){}
if(!Array.isArray(db))db=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(_){}};
const seedU=()=>[{id:1,nome:'Administrador',role:'admin',pin:'123456',ativo:true},{id:2,nome:'Recepção',role:'recepcao',pin:'111111',ativo:true},{id:3,nome:'Financeiro',role:'financeiro',pin:'222222',ativo:true},{id:4,nome:'Felipe',role:'mecanico',pin:'333333',ativo:true},{id:5,nome:'Henrique',role:'mecanico',pin:'444444',ativo:true},{id:6,nome:'João',role:'mecanico',pin:'555555',ativo:true},{id:7,nome:'João da Silva',role:'cliente',pin:'666666',ativo:true}];
let users=null;try{users=JSON.parse(localStorage.getItem('wkk-users-v1'))}catch(_){}
if(!Array.isArray(users))users=seedU();
const saveU=()=>{try{localStorage.setItem('wkk-users-v1',JSON.stringify(users))}catch(_){}};
const mecs=()=>users.filter(u=>u.role==='mecanico'&&u.ativo).map(u=>u.nome);
const sub=(o,t)=>o.it.filter(i=>i.t===t).reduce((s,i)=>s+i.q*i.v,0);
const tot=o=>Math.max(0,sub(o,'Serviço')+sub(o,'Peça')+sub(o,'Outros')-o.desc);
const paid=o=>o.pg.reduce((s,p)=>s+p.v,0);
const F=()=>db.find(o=>o.id===sel);
const mine=()=>db.filter(o=>role==='mecanico'?o.mec===me.nome:role==='cliente'?o.cli===me.nome:true).sort((a,b)=>b.id-a.id);
const bd=s=>`<span class="b" style="--c:var(${SC[s]})">${s}</span>`;
const opt=(a,s)=>a.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
const kpi=([i,l,v,c])=>`<div class="card kpi" style="--c:var(${c})"><small>${i} ${l}</small><strong>${v}</strong></div>`;
function ask(m,fn){$('#mt').textContent=m;$('#md').classList.add('on');ask.ok=()=>{$('#md').classList.remove('on');fn()};ask.no=()=>{$('#md').classList.remove('on');render()}}
function resetDemo(){db=seed();users=seedU();saveU();save();toast('Dados de exemplo restaurados')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
function log(o,t){o.log.push(new Date().toLocaleString('pt-BR')+' · '+me.nome+' · '+t)}
function go(v,id){view=v;if(id)sel=id;render();scrollTo(0,0)}
function login(r){role=r;view=ROLES[r][2][0][0];render()}
function out(){role=null;me=null;pin='';render()}
function key(k){
 if(Date.now()<lockUntil){toast('Muitas tentativas. Aguarde '+Math.ceil((lockUntil-Date.now())/1000)+'s');return}
 if(k==='C')pin='';else if(k==='B')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;
 if(pin.length===6){
  const u=users.find(x=>x.pin===pin&&x.ativo);pin='';
  if(u){bad=0;me=u;role=u.role;view=ROLES[role][2][0][0];toast('Bem-vindo, '+u.nome);return render()}
  shake=true;bad++;if(bad>=5){lockUntil=Date.now()+30000;bad=0;toast('Muitas tentativas. Tente de novo em 30s')}else toast('PIN incorreto ou acesso desativado')
 }
 render();
}
const genPin=()=>{let p;do{p=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000)}while(users.some(x=>x.pin===p));return p};
function vUsr(){
 const u=editU==='new'?{nome:'',role:'mecanico',pin:''}:users.find(x=>x.id===editU);
 let h=`<div class="row"><h2>Usuários e acessos</h2><button class="btn bl" onclick="editU='new';render()">+ Novo login</button></div>`;
 if(u)h+=`<div class="card"><b>${editU==='new'?'Novo login':'Editar login'}</b><input id="u_n" placeholder="Nome" value="${e(u.nome)}"><select id="u_r">${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}</select><small>Para cliente, use o mesmo nome do cadastro nas OS.</small><div class="f2"><input id="u_p" inputmode="numeric" maxlength="6" placeholder="PIN de 6 números" value="${e(u.pin)}"><button class="btn" onclick="$('#u_p').value=genPin()">Gerar PIN</button></div><div class="btns"><button class="btn" onclick="editU=null;render()">Cancelar</button><button class="btn bl" onclick="saveUsr()">Salvar</button></div></div>`;
 return h+users.map(x=>`<div class="card"><div class="row"><b>${e(x.nome)}</b><span class="b" style="--c:var(${x.ativo?'--gr':'--mut'})">${x.ativo?'ATIVO':'INATIVO'}</span></div><small>${RL[x.role]} · PIN ${e(x.pin)}</small><div class="btns"><button class="btn" onclick="editU=${x.id};render()">Editar</button>${x.id===me.id?'':`<button class="btn ${x.ativo?'rd':'gr'}" onclick="togU(${x.id})">${x.ativo?'Desativar':'Reativar'}</button>`}</div></div>`).join('');
}
function saveUsr(){
 const nome=$('#u_n').value.trim(),r=$('#u_r').value,p=$('#u_p').value.trim(),cur=users.find(x=>x.id===editU);
 if(nome.length<2){toast('Informe o nome do usuário');return}
 if(!/^\d{6}$/.test(p)){toast('O PIN deve ter exatamente 6 números');return}
 if(users.some(x=>x.pin===p&&x!==cur)){toast('Este PIN já está em uso. Gere outro.');return}
 if(users.some(x=>x.nome.toLowerCase()===nome.toLowerCase()&&x!==cur)){toast('Já existe um usuário com este nome');return}
 if(cur===me&&r!==cur.role){toast('Você não pode mudar o próprio perfil');return}
 if(cur){db.forEach(o=>{if(o.mec===cur.nome)o.mec=nome;if(o.cli===cur.nome)o.cli=nome});Object.assign(cur,{nome,role:r,pin:p})}
 else users.push({id:Math.max(0,...users.map(x=>x.id))+1,nome,role:r,pin:p,ativo:true});
 editU=null;save();saveU();render();toast('Login salvo')
}
function togU(id){
 const x=users.find(u=>u.id===id),n=x.role==='mecanico'?db.filter(o=>o.mec===x.nome&&!['ENTREGUE','CANCELADO','FINALIZADO'].includes(o.st)).length:0;
 ask((x.ativo?'Desativar':'Reativar')+' o acesso de '+x.nome+'?'+(x.ativo&&n?' Ele tem '+n+' OS em aberto.':''),()=>{x.ativo=!x.ativo;saveU();render();toast(x.ativo?'Acesso reativado':'Acesso desativado')})
}
function render(){
 const a=$('#app'),n=$('#nav');
 if(!role){n.style.display='none';a.innerHTML=vLogin();return}
 n.style.display='';
 n.innerHTML=ROLES[role][2].map(([k,l,i])=>`<button class="${k===(view==='os'?(role==='mecanico'&&F()&&done(F())?'hist':'list'):view)?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')+`<button onclick="out()"><span>🚪</span>Sair</button>`;
