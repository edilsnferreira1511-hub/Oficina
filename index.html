</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div><div id="md"><div><p id="mt"></p><div class="btns"><button class="btn" onclick="ask.no()">Cancelar</button><button class="btn bl" onclick="ask.ok()">Confirmar</button></div></div></div><div id="pr"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=c=>'R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(6,'0'),br=d=>d.split('-').reverse().join('/');
const cents=v=>Math.round(parseFloat(String(v||'0').replace(',','.'))*100);
const ST=['AGUARDANDO DIAGNÓSTICO','DIAGNÓSTICO','AGUARDANDO ORÇAMENTO','AGUARDANDO APROVAÇÃO','AGUARDANDO PEÇA','EM ANDAMENTO','PAUSADO','FINALIZADO','PRONTO PARA ENTREGA','ENTREGUE','CANCELADO'];
const SC={'AGUARDANDO DIAGNÓSTICO':'--rd','DIAGNÓSTICO':'--bl','AGUARDANDO ORÇAMENTO':'--ye','AGUARDANDO APROVAÇÃO':'--pu','AGUARDANDO PEÇA':'--or','EM ANDAMENTO':'--bl','PAUSADO':'--mut','FINALIZADO':'--gr','PRONTO PARA ENTREGA':'--gr','ENTREGUE':'--gd','CANCELADO':'--rd2'};
const BC={rascunho:'--mut',enviado:'--bl',aprovado:'--gr',recusado:'--rd'};
const RL={admin:'Administrador',recepcao:'Recepção',financeiro:'Financeiro',mecanico:'Mecânico',cliente:'Cliente'};
const PL=['Frente','Traseira','Lateral esq.','Lateral dir.','Painel / KM','Área do problema'];
const CK=['Riscos','Amassados','Para-brisa','Faróis','Pneus','Bancos','Painel','Motor','Freios','Suspensão'];
const ROLES={admin:['Administrador','🛠️',[['dash','Painel','📊'],['ent','Entrada','➕'],['list','OS','📋'],['fin','Financeiro','💰'],['usr','Usuários','👥']]],recepcao:['Recepção','🧾',[['ent','Entrada','➕'],['list','OS','📋']]],financeiro:['Financeiro','💵',[['fin','Financeiro','💰'],['list','OS','📋']]],mecanico:['Mecânico','🔧',[['list','Meus serviços','🔧'],['hist','Histórico','🗂️']]],cliente:['Cliente','🚗',[['list','Meus veículos','🚗']]]};
const mk=o=>({diag:'',it:[],desc:0,bs:'rascunho',pg:[],ph:[],sp:[],log:[],ck:[],hora:'08:30',...o});
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fkm=v=>{const k=Number(String(v).replace(/\D/g,''));return k?k.toLocaleString('pt-BR'):e(v||'—')};
const num=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtTel=t=>{const d=String(t||'').replace(/\D/g,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:e(t||'—')};
const sha256=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

/* ===== Firebase ===== */
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),FS=firebase.firestore(),FSTORE=firebase.storage(),FN=firebase.app().functions('southamerica-east1');
const call=(name,data)=>FN.httpsCallable(name)(data).then(r=>r.data);
const FV=firebase.firestore.FieldValue;

/* ===== Estado local (o "db" continua sendo um array em memória — só que agora alimentado por listeners do Firestore, não por localStorage) ===== */
let q='',fst='',fbs='',srt='etapa',LB=()=>'',me=null,pin='',bad=0,lockUntil=0,shake=false,busy=false,showBoot=false;
let editU=null,db=[],users=[],role=null,view='',sel=null,draft={ph:[]};
let woMap=new Map(),bgMap=new Map(),usersUnsub=null,woUnsub=null,bgAllUnsub=null,bgOneUnsub=null;

/* ===== Camada de sincronização com o Firestore =====
   Ideia: cada OS = 1 doc em workOrders/{osNumber} + 1 doc irmão em budgets/{osNumber}
   (o mesmo número/ID nos dois, então não precisa de busca extra).
   O array local "db" continua tendo o mesmo formato de campos de antes
   (o.cli, o.vei, o.st, o.it, o.bs, o.desc, o.pg, o.ph, o.sp, o.ck, o.log...):
   quem muda são só as funções que leem/gravam — as telas (vDash, vList, vOs, card, kpi, sheet, mkPdf...)
   continuam iguais. */
const logLine=t=>new Date().toLocaleString('pt-BR')+' · '+(me?me.nome:'—')+' · '+t;
function mergedObj(id){
 const w=woMap.get(id);if(!w)return null;
 const b=bgMap.get(id)||{};
 return mk({
  id,cli:w.cli,tel:w.tel,cpf:w.cpf,tipo:w.tipo,vei:w.vehicleLabel,ano:w.ano,placa:w.placa,km:w.km,
  relato:w.complaint,diag:w.diagnosis||'',mec:w.mechanicName||'',mechanicUid:w.mechanicUid||'',
  st:w.status,serv:w.serv||'',data:w.data,hora:w.hora||'',
  ph:w.entryPhotoUrls||[],sp:(w.servicePhotos||[]).map(p=>({s:p.url,c:p.c})),ck:w.checklist||[],
  log:w.log||[],pg:w.pg||[],
  it:(b.items||[]).map(i=>({t:i.type,d:i.description,q:i.qty,v:i.unitCents==null?null:i.unitCents,by:i.by})),
  desc:b.discountCents||0,bs:b.status||'rascunho',approvalToken:b.approvalToken||''
 });
}
function rebuild(){ db=[...woMap.keys()].map(mergedObj).filter(Boolean); render(); }
function stopListeners(){
 woUnsub&&woUnsub();bgAllUnsub&&bgAllUnsub();usersUnsub&&usersUnsub();bgOneUnsub&&bgOneUnsub();
 woUnsub=bgAllUnsub=usersUnsub=bgOneUnsub=null;woMap=new Map();bgMap=new Map();db=[];users=[];
}
function startListeners(){
 stopListeners();
 let wq;
 if(role==='mecanico')wq=FS.collection('workOrders').where('mechanicUid','==',me.id);
 else if(role==='cliente')wq=FS.collection('workOrders').where('customerUid','==',me.id);
 else wq=FS.collection('workOrders');
 woUnsub=wq.onSnapshot(snap=>{
  snap.docChanges().forEach(c=>{const id=Number(c.doc.id);c.type==='removed'?woMap.delete(id):woMap.set(id,c.doc.data())});
  rebuild();
 },err=>toast('Erro ao sincronizar OS: '+err.message));
 if(role==='admin'||role==='financeiro'){
  bgAllUnsub=FS.collection('budgets').onSnapshot(snap=>{
   snap.docChanges().forEach(c=>{const id=Number(c.doc.id);c.type==='removed'?bgMap.delete(id):bgMap.set(id,c.doc.data())});
   rebuild();
  },err=>toast('Erro ao sincronizar orçamentos: '+err.message));
 }
 if(role==='admin'||role==='recepcao'||role==='financeiro'){
  usersUnsub=FS.collection('users').onSnapshot(snap=>{users=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
 }
}
function watchBudget(id){
 bgOneUnsub&&bgOneUnsub();bgOneUnsub=null;
 if(role==='recepcao'||id==null)return;
 bgOneUnsub=FS.doc('budgets/'+id).onSnapshot(snap=>{if(snap.exists)bgMap.set(id,snap.data());rebuild()},()=>{});
}
async function updateBudget(id,fn){
 const ref=FS.doc('budgets/'+id);
 await FS.runTransaction(async tx=>{
  const snap=await tx.get(ref);
  const d=snap.data()||{items:[],discountCents:0};
  const patch=fn(JSON.parse(JSON.stringify(d)));
  tx.update(ref,patch);
 });
}

async function key(k){

 if(Date.now()<lockUntil){toast('Muitas tentativas. Aguarde '+Math.ceil((lockUntil-Date.now())/1000)+'s');return}
 if(k==='C')pin='';else if(k==='B')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;
 render();
 if(pin.length===6){
  const p=pin;pin='';busy=true;render();
  try{
   const r=await call('signInWithPin',{pin:p});
   await auth.signInWithCustomToken(r.token);
   bad=0;
  }catch(err){
   shake=true;bad++;
   if(err&&err.code==='functions/resource-exhausted')lockUntil=Date.now()+30000;
   toast((err&&err.message)||'PIN incorreto ou acesso desativado');

 }

async function saveUsr(){
 const nome=$('#u_n').value.trim(),r=$('#u_r').value,pv=$('#u_p').value.trim(),isNew=editU==='new';
 if(nome.length<2){toast('Informe o nome do usuário');return}
 if((isNew||pv)&&!/^\d{6}$/.test(pv)){toast('O PIN deve ter exatamente 6 números');return}
 if(!isNew&&editU===me.id&&r!==me.role){toast('Você não pode mudar o próprio perfil');return}
 if(users.some(x=>x.nome.toLowerCase()===nome.toLowerCase()&&x.id!==editU)){toast('Já existe um usuário com este nome');return}
 if(busy)return; busy=true;
 try{
  let hash=null;
  if(pv){
   hash=await sha256(pv);
   const dup=await FS.collection('users').where('pinHash','==',hash).limit(1).get();
   if(!dup.empty&&dup.docs[0].id!==editU){toast('Este PIN já está em uso. Gere outro.');busy=false;return}
  }
  if(isNew)await FS.collection('users').add({nome,role:r,pinHash:hash,ativo:true,criadoEm:FV.serverTimestamp()});
  else{const patch={nome,role:r};if(hash)patch.pinHash=hash;await FS.doc('users/'+editU).update(patch)}
  editU=null;toast('Login salvo');
 }catch(err){toast(err.message||'Não foi possível salvar')}
 busy=false;
}

 const n=x.role==='mecanico'?db.filter(o=>o.mechanicUid===x.id&&!['ENTREGUE','CANCELADO','FINALIZADO'].includes(o.st)).length:0;
 if(n){toast(x.nome+' tem '+n+' OS em aberto. Troque o mecânico dessas OS ou use Desativar.');return}

 })

  const now=new Date(),seqRef=FS.doc('counters/workOrders');

    entryPhotoUrls:[],servicePhotos:[],checklist:ck,pg:[],log:[logLine('OS criada')],criadoEm:FV.serverTimestamp(),criadoPor:me.id});
   tx.set(FS.doc('budgets/'+next),{workOrderId:next,osNumber:next,customerUid,vehicleLabel:vei,plate:placa,complaint:relato,notes:'',
    items:[],discountCents:0,status:'rascunho',version:0,criadoEm:FV.serverTimestamp()});

  });
  const files=photos.map((d,i)=>d?{i,d}:null).filter(Boolean);
  if(files.length){

   await Promise.all(files.map(async f=>{const snap=await FSTORE.ref('workOrders/'+id+'/entrada/'+f.i+'.jpg').putString(f.d,'data_url');urls[f.i]=await snap.ref.getDownloadURL()}));
   await FS.doc('workOrders/'+id).update({entryPhotoUrls:urls.filter(Boolean)});
  }
  toast('OS #'+pad(id)+' criada');go('os',id);

 busy=false;
}

/* ===== Ações da OS — agora gravam no Firestore; a tela atualiza sozinha pelos listeners ===== */
function delOS(){
 const o=F();if(role!=='admin'||!o)return;
 ask('Por segurança, o sistema não permite excluir uma OS (fica registrado para auditoria). Deseja marcar como CANCELADO em vez disso?',()=>setSt('CANCELADO'));
}
async function delPg(n){
 const o=F();if(role!=='admin'||!o.pg[n])return;
 try{
  await FS.runTransaction(async tx=>{
   const ref=FS.doc('workOrders/'+o.id),snap=await tx.get(ref),data=snap.data(),pg=(data.pg||[]).slice(),removed=pg.splice(n,1)[0];
   tx.update(ref,{pg,log:FV.arrayUnion(logLine('pagamento apagado: '+R(removed.v)+' ('+removed.f+')'))});
  });
  toast('Pagamento apagado');
 }catch(err){toast(err.message)}
}
function setSt(v){
 const o=F();
 const run=async()=>{try{await FS.doc('workOrders/'+o.id).update({status:v,log:FV.arrayUnion(logLine('status → '+v))});toast('Status atualizado')}catch(err){toast(err.message)}};
 ['FINALIZADO','ENTREGUE','CANCELADO'].includes(v)?ask('Alterar o status para '+v+'?',run):run();
}
function setMec(v){
 const o=F();if(!v||v===o.mec){render();return}
 const target=users.find(u=>u.nome===v&&u.role==='mecanico');
 if(!target){toast('Mecânico não encontrado');return}
 ask(o.mec?'Trocar o mecânico de '+o.mec+' para '+v+'?':'Atribuir '+v+' a esta OS?',async()=>{
  try{await FS.doc('workOrders/'+o.id).update({mechanicUid:target.id,mechanicName:v,log:FV.arrayUnion(logLine('mecânico: '+(o.mec||'nenhum')+' → '+v))});toast('Mecânico atualizado')}
  catch(err){toast(err.message)}
 })
}
async function saveDiag(){
 const o=F();
 try{await FS.doc('workOrders/'+o.id).update({diagnosis:$('#diag').value,log:FV.arrayUnion(logLine('diagnóstico salvo'))});toast('Diagnóstico salvo')}
 catch(err){toast(err.message)}
}
async function addIt(){
 const o=F(),d=$('#i_d').value.trim(),qv=parseInt($('#i_q').value),v=cents($('#i_v').value),t=$('#i_t').value;
 if(!d||!(qv>=1)||!(v>=0)){toast('Informe descrição, quantidade e valor');return}
 try{await updateBudget(o.id,data=>({items:[...(data.items||[]),{type:t,description:d,qty:qv,unitCents:v,by:me.nome}]}));toast('Item adicionado')}
 catch(err){toast(err.message)}
}
async function delIt(n){
 const o=F();
 try{
  await updateBudget(o.id,data=>{
   const items=(data.items||[]).slice();items.splice(n,1);
   const max=items.reduce((s,i)=>s+Math.round(i.qty)*Math.round(i.unitCents||0),0);
   return{items,discountCents:Math.min(data.discountCents||0,max)};
  });
 }catch(err){toast(err.message)}
}
async function setDesc(v){
 const o=F(),c=cents(v);
 try{
  await updateBudget(o.id,data=>{
   const max=(data.items||[]).reduce((s,i)=>s+Math.round(i.qty)*Math.round(i.unitCents||0),0);
   return{discountCents:isNaN(c)||c<0?0:Math.min(c,max)};
  });
 }catch(err){toast(err.message)}
}
async function resp(ok){
 const o=F();
 if(!o.approvalToken){toast('Este orçamento não tem um link de aprovação ativo no momento.');return}
 if(busy)return;busy=true;
 try{await call('decideBudget',{token:o.approvalToken,decision:ok?'aprovado':'recusado',reason:role==='cliente'?'Aprovado pelo cliente no app':'Registrado pela equipe'});toast(ok?'Orçamento aprovado':'Orçamento recusado')}
 catch(err){toast(err.message||'Não foi possível registrar a decisão')}
 busy=false;
}
async function pay(){
 const o=F(),v=cents($('#p_v').value),r=tot(o)-paid(o);
 if(!(v>0)||v>r){toast('Valor inválido. Restante: '+R(r));return}
 const f=$('#p_f').value;
 ask('Registrar pagamento de '+R(v)+' ('+f+')?',async()=>{
  try{await FS.doc('workOrders/'+o.id).update({pg:FV.arrayUnion({f,v,d:new Date().toLocaleDateString('pt-BR')}),log:FV.arrayUnion(logLine('pagamento '+R(v)))});toast('Pagamento registrado')}
  catch(err){toast(err.message)}
 })
}

/* ===== Mecânico adiciona itens / envia pro financeiro ===== */
function mecCard(o){
 const lock=o.bs==='enviado'||o.bs==='aprovado';
 let h=`<div class="card"><b>Serviços e peças necessários</b>`;
 h+=o.it.map((i,n)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span>${i.t==='Peça'?'🔩':'🛠️'} ${e(i.d)} <small>×${i.q}${i.by?' · '+e(i.by):''}</small></span>${!lock&&i.by===me.nome?`<button class="btn" style="min-height:36px;padding:2px 10px" onclick="ask('Remover este item?',()=>delIt(${n}))">✕</button>`:''}</div>`).join('')||'<small>Nenhum item ainda. Adicione o serviço e as peças que você vai precisar.</small>';
 if(lock)return h+`<div class="aviso">Orçamento já enviado, fale com o financeiro.</div></div>`;
 h+=`<div class="f2" style="margin-top:10px"><select id="m_t"><option>Serviço</option><option>Peça</option></select><input id="m_q" type="number" min="1" value="1" inputmode="numeric"></div><input id="m_d" placeholder="Descrição (ex.: mão de obra troca de bomba)"><button class="btn w" onclick="addM()">Adicionar</button>`;
 h+=o.st==='AGUARDANDO ORÇAMENTO'?`<div class="aviso" style="margin-top:10px">✔ Enviado ao financeiro. Você ainda pode adicionar itens.</div>`:`<button class="btn bl w" onclick="sendFin()">Enviar para o financeiro</button>`;
 return h+'</div>';
}
async function addM(){
 const o=F(),d=$('#m_d').value.trim(),qv=parseInt($('#m_q').value),t=$('#m_t').value;
 if(o.bs==='enviado'||o.bs==='aprovado'){toast('Orçamento já enviado, fale com o financeiro');return}
 if(d.length<3||!(qv>=1)){toast('Informe a descrição e a quantidade');return}
 try{await updateBudget(o.id,data=>({items:[...(data.items||[]),{type:t,description:d,qty:qv,unitCents:null,by:me.nome}]}));toast('Item adicionado')}
 catch(err){toast(err.message)}
}
function sendFin(){
 const o=F();if(!o.it.length){toast('Adicione ao menos um serviço ou peça');return}
 ask('Enviar a lista para o financeiro montar o orçamento?',async()=>{
  try{await FS.doc('workOrders/'+o.id).update({status:'AGUARDANDO ORÇAMENTO',log:FV.arrayUnion(logLine('enviou serviços e peças para o financeiro'))});toast('Enviado ao financeiro')}
  catch(err){toast(err.message)}
 })
}

/* ===== Envio do orçamento (agora via Cloud Function sendBudget, que gera o link público de aprovação) ===== */
async function setV(n){
 const o=F(),d=$('#pd'+n).value.trim(),raw=$('#pv'+n).value.trim(),v=cents(raw);
 if(d.length<3||raw===''||!(v>=0)){toast('Informe a descrição e o valor unitário');return}
 try{await updateBudget(o.id,data=>{const items=data.items||[];if(items[n])items[n]={...items[n],description:d,unitCents:v};return{items}});toast('Valor definido')}
 catch(err){toast(err.message)}
}
function waBtn(){
 const o=F();if(!o.it.length){toast('Adicione itens ao orçamento primeiro');return}
 if(o.it.some(i=>i.v==null)){toast('Defina o valor de todos os itens antes de enviar');return}
 if(o.bs==='enviado'||o.bs==='aprovado')return wa();
 ask('Enviar o orçamento ao cliente? A OS passa para Aguardando aprovação.',wa)
}
async function mark(o){
 if(o.bs==='rascunho'||o.bs==='recusado'){try{return(await call('sendBudget',{budgetId:o.id})).link}catch(err){toast(err.message);return null}}
 return null;
}
async function wa(){
 const o=F(),nm='Orcamento-WKK-OS'+pad(o.id)+'.pdf';
 if(busy)return;busy=true;
 const link=await mark(o);
 const m=`Olá, ${o.cli.split(' ')[0]}!\n\nA WKK Oficina Mecânica Auto Center preparou o orçamento referente ao seu veículo.\n\n🚗 Veículo: ${o.vei}\n🔢 Placa: ${o.placa}\n📋 OS: #${pad(o.id)}\n💰 Total: ${R(tot(o))}${link?'\n\n✅ Aprovar ou recusar: '+link:''}\n\nO orçamento completo está disponível abaixo no PDF`;
 toast('Preparando o PDF…');let b=null;try{b=await mkPdf(o)}catch(_){}
 if(b){const f=new File([b],nm,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:m});busy=false;return}catch(x){if(x&&x.name==='AbortError'){busy=false;return}}}
  dl(b,nm);toast('PDF baixado. Anexe no WhatsApp.')}
 window.open('https://wa.me/55'+o.tel.replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank');
 busy=false;
}

/* ===== Assistente WKK de verdade (Cloud Function askAssistant → Claude) ===== */
async function ia(){
 const o=F(),qv=$('#iaq').value.trim();
 if(!qv){toast('Descreva o problema primeiro');return}
 if(busy)return;busy=true;
 $('#iar').innerHTML='<small>Consultando o assistente…</small>';
 try{
  const r=await call('askAssistant',{osId:o.id,question:qv});
  $('#iar').innerHTML=`<p>${e(r.text).replace(/\n/g,'<br>')}</p><div class="aviso">${e(r.aviso)}</div>${r.demo?'<small>Modo demonstração: configure a chave da IA no servidor (veja o README).</small>':''}`;
 }catch(err){$('#iar').innerHTML='';toast(err.message||'O assistente não respondeu')}
 busy=false;
}
addEventListener('keydown',ev=>{if(role||document.activeElement.tagName==='INPUT')return;if(/^\d$/.test(ev.key))key(ev.key);else if(ev.key==='Backspace')key('B')});

/* ===== Página pública de aprovação (/aprovar?t=...) — sem login, só com o token do link ===== */
function isApprovalRoute(){return new URLSearchParams(location.search).has('t')||location.pathname.replace(/\/$/,'').endsWith('/aprovar')}
let approvalData=null,approvalToken=null;
const wm=()=>'<div class="wm"><b>WKK</b><span>OFICINA MECÂNICA</span><small>AUTO CENTER</small></div>';
async function loadApproval(){
 approvalToken=new URLSearchParams(location.search).get('t');
 $('#nav').style.display='none';
 $('#app').innerHTML=`<div class="login">${wm()}<div class="card" style="text-align:center"><small>Carregando orçamento…</small></div></div>`;
 try{approvalData=await call('getBudgetByToken',{token:approvalToken});renderApproval()}
 catch(err){$('#app').innerHTML=`<div class="login">${wm()}<div class="card" style="text-align:center"><b>Link indisponível</b><p><small>${e(err.message||'Este link não é válido ou já foi utilizado.')}</small></p></div></div>`}
}
function renderApproval(){
 const d=approvalData;
 const sub2=t=>(d.items||[]).filter(i=>i.type===t).reduce((s,i)=>s+Math.round(i.qty)*Math.round(i.unitCents||0),0);
 const rows=t=>(d.items||[]).filter(i=>i.type===t).map(i=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span>${e(i.description)} <small>×${i.qty}</small></span><b>${R(Math.round(i.qty)*Math.round(i.unitCents||0))}</b></div>`).join('')||'<small>—</small>';
 $('#app').innerHTML=`<div class="login" style="max-width:460px">${wm()}
<div class="card"><b style="font-size:17px">Orçamento da OS #${pad(d.osNumber)}</b><p>🚗 ${e(d.vehicle)} · <b>${e(d.plate)}</b></p>${d.complaint?`<small>Relato: ${e(d.complaint)}</small>`:''}</div>
<div class="card"><b>Serviços</b>${rows('Serviço')}</div>
<div class="card"><b>Peças</b>${rows('Peça')}</div>
${sub2('Outros')?`<div class="card"><b>Outros</b>${rows('Outros')}</div>`:''}
<div class="card"><div class="row"><small>Desconto</small><span>− ${R(d.discountCents||0)}</span></div><div class="row" style="margin-top:6px"><b>TOTAL</b><span class="tot">${R(d.totalCents||0)}</span></div></div>
<div class="card"><p style="text-align:center"><small>Você confirma que está de acordo com os serviços e valores apresentados?</small></p><div class="btns"><button class="btn gr" onclick="decideApproval('aprovado')">🟢 APROVAR ORÇAMENTO</button><button class="btn rd" onclick="decideApproval('recusado')">🔴 RECUSAR ORÇAMENTO</button></div></div>
</div>`;
}
async function decideApproval(decision){
 if(busy)return;busy=true;
 try{
  await call('decideBudget',{token:approvalToken,decision});
  $('#app').innerHTML=`<div class="login">${wm()}<div class="card" style="text-align:center"><b>${decision==='aprovado'?'✅ Orçamento aprovado':'❌ Orçamento recusado'}</b><p><small>Obrigado! A oficina já foi avisada.</small></p></div></div>`;
 }catch(err){toast(err.message||'Não foi possível registrar sua decisão')}
 busy=false;
}

/* ===== Inicialização ===== */
if(isApprovalRoute()){
 loadApproval();
}else{
 render();
 auth.onAuthStateChanged(async u=>{
  if(!u){me=null;role=null;view='';sel=null;stopListeners();render();return}
  try{
   const snap=await FS.doc('users/'+u.uid).get();
   if(!snap.exists||snap.data().ativo===false){await auth.signOut();toast('Acesso desativado');return}
   const d=snap.data();
   me={id:u.uid,nome:d.nome,role:d.role};role=d.role;view=ROLES[role][2][0][0];sel=null;
   startListeners();render();
  }catch(err){toast('Erro ao carregar sua sessão: '+err.message)}
 });
}
