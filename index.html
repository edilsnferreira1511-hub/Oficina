<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP restritiva: nada de scripts/estilos inline; a única rede permitida é a de IMAGENS de ladrilhos do provedor de mapas
       (img-src). Ao trocar de provedor, troque o host aqui e em map-config.js. connect-src continua 'none'. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <title>COOPMETRO XPT · Demonstração</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3l9 4.5v9L12 21l-9-4.5v-9z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></symbol>
      <symbol id="i-entry" viewBox="0 0 24 24"><path d="M4 12h11"/><path d="M11 8l4 4-4 4"/><path d="M15 4h5v16h-5"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M20 12H9"/><path d="M13 8l-4 4 4 4"/><path d="M9 4H4v16h5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></symbol>
      <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6M3 21h18"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="demo-banner" role="note"><strong>AMBIENTE DE DEMONSTRAÇÃO</strong><span>dados fictícios, sem gravação no sistema real</span></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <img src="logo-coopmetro.jpg" alt="COOPMETRO" width="64" height="64" class="brand-logo">
        <span class="brand-text"><strong>COOPMETRO</strong><span>XPT · protótipo</span></span>
      </div>
      <nav id="nav" class="nav"></nav>
      <p class="sidebar-foot">Protótipo local v1. Logotipo enviado pelo proprietário; uso oficial ainda a confirmar.</p>
    </aside>
    <div class="overlay" id="overlay" hidden></div>
    <div class="content">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Esta demonstração precisa de JavaScript.</p></noscript>

  <script src="data.js"></script>
  <script src="geo.js"></script>
  <script src="packages.js"></script>
  <script src="codes.js"></script>
  <script src="alerts.js"></script>
  <script src="reports.js"></script>
  <script src="permissions.js"></script>
  <script src="audit.js"></script>
  <script src="registry.js"></script>
  <script src="ambulance.js"></script>
  <script src="qr.js"></script>
  <script src="operations.js"></script>
  <script src="store.js"></script>
  <script src="map-config.js"></script>
  <script src="ui.js"></script>
  <script src="map.js"></script>
  <script src="views.js"></script>
  <script src="views-entry.js"></script>
  <script src="views-ops.js"></script>
  <script src="views-map.js"></script>
  <script src="views-admin.js"></script>
  <script src="views-amb.js"></script>
  <script src="app.js"></script>
</body>
</html>
